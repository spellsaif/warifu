[package]
name = "warifu-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-performance, memory-safe cryptographic core for Warifu 2FA"

[lib]
name = "warifu_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
ring = "0.17"
data-encoding = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
thiserror = "1.0"
url = "2.5"
prost = "0.13"
percent-encoding = "2.3"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
argon2 = { version = "0.5", features = ["alloc", "rand"] }
libc = "0.2"
getrandom = "0.2"
uuid = { version = "1.8", features = ["v4"] }
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
proptest = "1.5"
