[package]
name = "openauth-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.openauth_core]
path = "../core"

[[bin]]
name = "fuzz_uri"
path = "fuzz_targets/fuzz_uri.rs"
test = false
doc = false

[[bin]]
name = "fuzz_migration"
path = "fuzz_targets/fuzz_migration.rs"
test = false
doc = false
